/*
VOICE: 상담 팀의 업무 도구. 차분하고 빠르게 훑어보는 관제판.
IDEA: 학과별 칸이 나란히 놓인 상담 데스크 보드.
PICTURE: 학과 칸마다 링크를 연 비율이 차오르는 막대.
COLOUR and TYPE: 안내 사이트 통합판과 같은 먹색 바탕, 학과색은 칸 머리와 막대에만. Pretendard.
LAYOUT: 위 학과 탭, 통합은 요약 숫자·학과 칸·전체 목록, 세부는 발급창·결과 분포·목록.
*/
:root{color-scheme:dark;--bg:#0a0a0c;--ink:#f3f3f5;--sub:#a1a1aa;--mut:#6b6b74;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--glass:rgba(255,255,255,.035);--glass2:rgba(255,255,255,.07);--c:#c8553d;--ca:color-mix(in srgb,var(--c) 62%,#fff);--ease:cubic-bezier(.16,1,.3,1);--f:"Pretendard",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f);letter-spacing:-.011em;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ca);outline-offset:2px;border-radius:8px}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(3vw,16px)}
.top{position:sticky;top:0;z-index:30;background:rgba(10,10,12,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:14px;height:58px}
.brand{font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.brand span{color:var(--mut);font-weight:500;margin-left:8px}
.who{margin-left:auto;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#5be49b;box-shadow:0 0 0 3px rgba(91,228,155,.18)}
.dot.off{background:#f0b44c;box-shadow:0 0 0 3px rgba(240,180,76,.18)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:14px;color:var(--sub);text-decoration:none;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--ink);border-color:var(--line2)}
.tab.on{background:var(--ink);color:#0b0b0d;border-color:var(--ink);font-weight:600}
.tab i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.tab b{font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--c);color:#fff;display:inline-grid;place-items:center}
main{padding:28px 0 80px}
h1{font-size:clamp(26px,3vw,34px);line-height:1.2;font-weight:750;letter-spacing:-.04em;margin:0 0 6px}
h2{font-size:19px;font-weight:700;letter-spacing:-.03em;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2 small{font-size:13px;font-weight:500;color:var(--mut)}
.lead{color:var(--sub);margin:0;max-width:52em}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--ink);background:var(--ink);color:#0b0b0d;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .2s var(--ease),background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--glass);color:var(--ink);border-color:var(--line2)}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn.danger{background:transparent;border-color:rgba(242,124,124,.4);color:#f27c7c}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.panel{border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:22px;margin-bottom:18px}
.warn{padding:14px 16px;border-radius:14px;border:1px solid rgba(240,180,76,.35);background:rgba(240,180,76,.07);color:#e9cf9c;font-size:14px;margin-bottom:18px}
.warn b{color:#f7dfb1}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stat{padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--glass);text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.stat:hover{border-color:var(--line2)}
.stat.on{border-color:var(--ink);background:var(--glass2)}
.stat b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--sub)}
.stat.hotb b{color:#ff8a6b}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px;margin-bottom:26px}
.cell{position:relative;padding:18px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 14%,transparent),var(--glass) 55%);overflow:hidden}
.cell::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--dc)}
.cell h3{margin:0 0 12px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cell h3 a{font-size:12.5px;font-weight:500;color:var(--sub);text-decoration:none}
.cell h3 a:hover{color:var(--ink)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:12px}
.nums div{font-size:11.5px;color:var(--mut)}
.nums b{display:block;font-size:19px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.nums .w b{color:#ff8a6b}
.pbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;background:var(--dc);transition:width .8s var(--ease)}
.cell .row{display:flex;gap:6px}
.cell .row .btn{flex:1}

{

function parseLine(line){
  const ph = line.match(/01[016789][-\s.]?\d{3,4}[-\s.]?(\d{4})/);
  let memo = ph ? ph[1] : ((line.match(/(?:^|\s)(\d{4})(?:\s|$)/)||[])[1]||"");
  const rest = ph ? line.replace(ph[0]," ") : line;
  const toks = rest.split(/[\t,|/]+|\s+/).map(x=>x.trim()).filter(Boolean);
  const name = toks.find(t=>/^[가-힣]{2,4}$/.test(t) && !STOP.has(t) && !KW.some(k=>k[1].some(w=>t.includes(w)))) || "";
  return {name, memo, dept:guessDept(line)};
}

function rows(dept){
  const vb={}; Object.values(S.views).forEach(v=>{ (vb[v.code]=vb[v.code]||[]).push(v); });
  const rb={}; Object.values(S.reqs).forEach(q=>{ if(q.code) (rb[q.code]=rb[q.code]||[]).push(q); });
  return Object.values(S.links).filter(l=>!dept||dept==="home"||l.dept===dept).map(l=>{
    const arr=(vb[l.code]||[]).sort((a,b)=>(b.last||b.start).localeCompare(a.last||a.start));
    const rq=(rb[l.code]||[]).sort((a,b)=>b.at.localeCompare(a.at));
    const want=(rq[0]||{}).time || (arr.find(v=>v.want)||{}).want || "";
    const result=(arr.find(v=>v.result)||{}).result || "";
    const ans=(arr.find(v=>v.ans&&v.ans.length)||{}).ans || [];
    const tprog=Math.max(0,...arr.map(v=>v.tprog||0));
    const depth=arr.length?Math.max(...arr.map(v=>v.depth||0)):-1;
    const st= want?"want": result?"done": arr.length?"open":"none";
    const first=arr.length?arr[arr.length-1].start:"", last=arr.length?(arr[0].last||arr[0].start):"";
    return {l,arr,rq,want,result,ans,tprog,depth,st,first,last};
  }).sort((a,b)=> ST[b.st][1]-ST[a.st][1] || (b.last||b.l.at||"").localeCompare(a.last||a.l.at||""));
}

function gate(){
  if (S.mode==="fb" && !S.user) return `<div class="panel" style="max-width:520px;margin:40px auto;text-align:center"><h1>직원 로그인</h1><p class="lead" style="margin:8px auto 18px">구글 계정으로 로그인해 주세요. 처음 쓰는 직원은 로그인한 뒤 '권한 신청'을 누르면 관리자가 승인해 줘요.</p><button class="btn" id="login">구글 계정으로 로그인</button>${S.loginErr?`<div class="warn" style="margin:18px 0 0;text-align:left">${S.loginErr}</div>`:""}</div>`;
  if (S.mode==="fb" && S.role==="setup") return `<div class="panel" style="max-width:560px;margin:40px auto"><h1>처음 설정</h1><p class="lead" style="margin:8px 0 16px">아직 관리자가 없어요. 지금 로그인한 계정(<b>${esc(S.user.email||"")}</b>)을 <b>관리자</b>로 등록할게요. 관리자는 다른 직원의 권한을 승인할 수 있어요. <b>한 번 등록하면 바꿀 수 없으니</b> 본인 계정인지 확인해 주세요.</p>
    <div class="f"><label for="ownName">내 이름 (담당자 이름으로 쓰여요)</label><input id="ownName" placeholder="예: 김태욱"></div><button class="btn" id="claim">관리자로 등록</button></div>`;
  if (S.mode==="fb" && S.role==="none") return `<div class="panel" style="max-width:520px;margin:40px auto"><h1>권한 신청</h1><p class="lead" style="margin:8px 0 16px">${esc(S.user.email||"")} 계정은 아직 권한이 없어요. 이름을 적고 신청하면 관리자가 승인한 뒤 바로 쓸 수 있어요.</p>
    <div class="f"><label for="apName">이름</label><input id="apName" placeholder="예: 김민영"></div><div style="display:flex;gap:8px"><button class="btn" id="apply">권한 신청</button><button class="btn ghost" id="logout2">다른 계정으로</button></div></div>`;
  if (S.mode==="fb" && S.role==="pending") return `<div class="panel" style="max-width:520px;margin:40px auto;text-align:center"><h1>승인 기다리는 중</h1><p class="lead" style="margin:8px auto 16px">${esc((S.me&&S.me.name)||"")}님의 권한 신청이 접수됐어요. 관리자가 승인하면 이 화면이 저절로 바뀌어요.</p><button class="btn ghost" id="logout2">다른 계정으로</button></div>`;
  if (!S.ready) return `<p class="muted">불러오는 중…</p>`;
  return "";
}
function localWarn(){
  return S.mode==="local" ? `<div class="warn"><b>아직 기록 저장 공간(Firebase)이 연결되지 않았어요.</b> 지금은 이 컴퓨터 브라우저에만 발급 목록이 남고, 학생이 링크를 열었는지는 보이지 않아요. 같은 폴더의 <b>aix-config.js</b>에 Firebase 설정을 넣으면 모든 직원이 같은 목록을 보고, 열람·검사·상담 희망이 실시간으로 표시돼요.</div>` : "";
}
function statsHTML(c){
  return `<div class="stats">${[["all","발급한 링크",c.all],["want","상담 시간 고름",c.want],["done","검사 완료",c.done],["open","열어만 봄",c.open],["none","아직 안 열어 봄",c.none]].map(x=>`<button type="button" class="stat${S.filter===x[0]?" on":""}${x[0]==="want"?" hotb":""}" data-filter="${x[0]}"><b>${x[2]}</b><span>${x[1]}</span></button>`).join("")}</div>`;
}
function issueHero(fixedDept){
  const qd = fixedDept || S.qdept || "all", d=DEPTS.find(x=>x.id===qd)||DEPTS[0];
  return `<section class="hero" style="--dc:${d.color}">
    <div class="hstep"><span class="n">1</span><b>학과</b>${fixedDept?`<span class="fixd"><i></i>${esc(d.name)}</span>`:`<div class="dpills">${DEPTS.map(x=>`<button type="button" class="dpill${x.id===qd?" on":""}" data-qd="${x.id}" style="--dc:${x.color}"><i></i>${esc(x.name)}</button>`).join("")}</div>`}</div>
    <div class="hstep"><span class="n">2</span><b>문구</b><div class="chips">${TPL.map((t,i)=>`<button type="button" class="chip${S.tpl===i?" on":""}" data-tpl="${i}">${esc(t[0])}</button>`).join("")}</div></div>
    <div class="hstep go"><span class="n">3</span><b>보내기</b>
      <div class="hq"><input data-qname="${qd}" id="heroName" placeholder="학생 이름 (안 써도 돼요)" aria-label="학생 이름"><button class="btn big" data-quick="${qd}">발급하고 문구 복사</button></div></div>
    <div class="hfoot"><span>복사된 문구를 카톡·문자에 붙여 넣으면 끝이에요.</span><button type="button" class="linkbtn" data-issue="${fixedDept||"pick"}">여러 명이면 DB 목록 붙여넣기 →</button>
      <span class="mgrset">담당자 <input id="meMgr" value="${esc(myMgr())}" placeholder="내 이름"></span></div>
  </section>`;
}
function todoHTML(rs){
  const todo=rs.filter(r=>(r.st==="want"||r.st==="done") && (r.l.handled||"미연락")==="미연락");
  if(!todo.length) return `<section class="todo empty2"><b>지금 바로 연락할 학생이 없어요.</b><span>학생이 상담 시간을 고르거나 검사를 마치면 여기에 먼저 떠요.</span></section>`;
  return `<section class="todo"><h2>지금 연락할 학생 <span class="cntb">${todo.length}</span></h2>
    <div class="tlist">${todo.slice(0,8).map(r=>`<div class="titem st-${r.st}"><div class="tn"><b>${esc(r.l.name||"(이름 없음)")}</b><span>${esc(DN(r.l.dept))}${r.l.memo?" · "+esc(r.l.memo):""}</span></div>
      <div class="tw">${r.want?`<em>상담 희망 ${esc(r.want)}</em>`:`<em class="d">검사 완료</em>`}<span>${esc(resultName(r.result))}</span></div>
      <button class="btn sm" data-done="${r.l.code}">연락함</button></div>`).join("")}</div>
    ${todo.length>8?`<p class="muted" style="margin:10px 0 0">외 ${todo.length-8}명은 아래 목록에서 '상담 시간 고름'·'검사 완료'를 눌러 보세요.</p>`:""}</section>`;
}
function home(all){
  const c=counts(all);
  return `${localWarn()}
  ${issueHero("")}
  ${todoHTML(all)}
  <h2>학과별 현황</h2>
  <div class="board"><div class="brow bh"><span>학과</span><span>보냄</span><span>열어 봄</span><span>검사</span><span>상담 희망</span><span></span></div>
  ${DEPTS.map(d=>{ const k=counts(all.filter(x=>x.l.dept===d.id)); const pct=k.all?Math.round(k.seen/k.all*100):0; return `<a class="brow" href="${d.id==="all"?"#":"#"+d.id}" style="--dc:${d.color}">
    <span class="bn"><i></i>${esc(d.name)}</span><span class="v">${k.all}</span><span class="v">${k.seen}<small>${k.all?pct+"%":""}</small></span><span class="v">${k.done+k.want}</span><span class="v">${k.want?`<b class="wb">${k.want}</b>`:"0"}</span><span class="ar">${d.id==="all"?"":"세부 →"}</span></a>`; }).join("")}</div>
  <h2 style="margin-top:30px">전체 학생 목록</h2>
  ${statsHTML(c)}
  ${listHTML(all,true)}`;
}
function deptPage(id){
  const d=DEPTS.find(x=>x.id===id), rs=rows(id), c=counts(rs);
  const dist={}; rs.forEach(r=>{ if(r.result) dist[r.result]=(dist[r.result]||0)+1; });
  const dk=Object.entries(dist).sort((a,b)=>b[1]-a[1]), dmax=Math.max(1,...dk.map(x=>x[1]));
  return `${localWarn()}
  <div class="head" style="--dc:${d.color}"><div><p class="muted" style="margin:0 0 4px;color:${d.color};font-weight:600">학과 세부</p><h1>${esc(d.name)}</h1><p class="lead">이 학과 안내 링크(${esc(d.file)})만 모아 봐요.</p></div>
    <div class="acts"><a class="btn ghost" href="${esc(baseDir()+d.file)}" target="_blank" rel="noopener">학생 화면 미리보기</a></div></div>
  ${statsHTML(c)}
  <div class="grid2">
    <div>${issueHero(id)}${todoHTML(rs)}
      <details class="panel bulk"${S.preview&&S.preview.ctx===id?" open":""}><summary>여러 명 한 번에 (DB 목록 붙여넣기)</summary>${issueHTML(id)}</details></div>
    <div class="panel dist"><h2>적성 결과 분포 <small>검사를 마친 ${dk.reduce((a,b)=>a+b[1],0)}명</small></h2>
      ${dk.length?dk.map(([k,v])=>`<div class="dr"><span>${esc(resultName(k))}</span><div class="pbar" style="--dc:${d.color}"><i style="width:${v/dmax*100}%"></i></div><b>${v}</b></div>`).join(""):`<p class="muted">아직 검사를 마친 학생이 없어요.</p>`}
      <h2 style="margin-top:22px">열람 단계 <small>어디까지 봤는지</small></h2>
      ${STEPS.map((s,i)=>{const n=rs.filter(r=>r.depth>=i).length;return `<div class="dr"><span>${s}</span><div class="pbar" style="--dc:${d.color}"><i style="width:${c.all?n/c.all*100:0}%"></i></div><b>${n}</b></div>`;}).join("")}
    </div>
  </div>
  <h2>${esc(d.name)} 학생 목록</h2>
  ${listHTML(rs,false)}`;
}
function issueHTML(dept){
  const fixed = dept && dept!=="pick";
  const pv = S.preview && S.preview.ctx===String(dept) ? S.preview : null;
  return `${fixed?`<input type="hidden" id="iDept" value="${dept}">`:`<div class="f"><label for="iDept">학과</label><select id="iDept"><option value="auto">자동으로 판단 (과목·문의 내용 보고)</option>${DEPTS.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join("")}</select></div>`}
    ${fixed?"":`<div class="f"><label>보낼 문구</label><div class="chips">${TPL.map((t,i)=>`<button type="button" class="chip${S.tpl===i?" on":""}" data-tpl="${i}">${esc(t[0])}</button>`).join("")}</div></div>`}
    <div class="f"><label for="iNames">인트라넷 DB 목록이나 엑셀을 그대로 복사해서 붙여 넣으세요</label><textarea id="iNames" rows="5" placeholder="예)&#10;김민지  010-1234-7788  웹디자인 문의&#10;이준호  010-5555-1234  엑셀 컴활&#10;박서연">${esc(S.dNames||"")}</textarea>
      <div class="hint">한 줄에 한 명씩, 이름·연락처·과목이 섞여 있어도 이름과 연락처 뒷자리${fixed?"":", 학과"}를 알아서 골라내요. 학생 링크에는 이름·연락처가 들어가지 않아요.</div></div>
    <button class="btn" data-parse="${dept}">${pv?"다시 읽기":"읽어 오기"}</button>
    ${pv?`<div class="pv"><div class="pvh"><b>${pv.rows.length}명</b>을 읽었어요. 틀린 곳만 고치고 발급하세요.</div>
      ${pv.rows.map((r,i)=>`<div class="pvr"><input data-pvn="${i}" value="${esc(r.name)}" placeholder="이름"><input data-pvm="${i}" value="${esc(r.memo)}" placeholder="뒷자리" class="sm4">${fixed?"":`<select data-pvd="${i}">${DEPTS.map(d=>`<option value="${d.id}"${r.dept===d.id?" selected":""}>${esc(d.name)}</option>`).join("")}</select>`}<button type="button" class="btn ghost sm" data-pvx="${i}">빼기</button><span class="src0">${esc(r.src)}</span></div>`).join("")}
      <button class="btn" data-make style="margin-top:10px">${pv.rows.length}명 링크 발급</button></div>`:""}
    <div class="made" id="made">${S.made.filter(m=>!fixed||m.dept===dept).map(madeHTML).join("")}</div>`;
}
function madeHTML(m){ return `<div class="lk${m.copied?" cp":""}" data-code="${m.code}"><div class="h"><b>${esc(m.name)}</b><span class="muted">${esc(DN(m.dept))}</span>${m.copied?`<span class="ok">복사함</span>`:""}</div><pre>${esc(m.msg)}</pre><div class="row"><button class="btn sm" data-copy="msg" data-code="${m.code}">문구 전체 복사</button><button class="btn ghost sm" data-copy="url" data-code="${m.code}">링크만 복사</button></div></div>`; }
function listHTML(rs,showDept){
  const mgrs=[...new Set(rs.map(r=>r.l.mgr).filter(Boolean))];
  const q=S.q, shown=rs.filter(r=>(S.filter==="all"||r.st===S.filter)&&(!S.mgr||r.l.mgr===S.mgr)&&(!q||((r.l.name||"")+(r.l.memo||"")+(r.l.mgr||"")+(r.l.note||"")).includes(q)));
  return `<div class="filters"><input id="fq" placeholder="이름·메모·담당자 검색" value="${esc(q)}"><select id="fm"><option value="">담당자 전체</option>${mgrs.map(m=>`<option${S.mgr===m?" selected":""}>${esc(m)}</option>`).join("")}</select><span class="muted" style="font-size:13px">${shown.length}명</span></div>
  ${shown.length?`<div class="list"><div class="lmain lhead"><span>학생</span><span>상태</span><span>${showDept?"학과":"담당"}</span><span>보낸 때</span><span>마지막 열람</span><span>열람</span><span>진행</span><span>결과 · 상담 희망</span><span>처리</span></div>
  ${shown.map(r=>rowHTML(r,showDept)).join("")}</div>`:`<div class="empty">${Object.keys(S.links).length?"조건에 맞는 학생이 없어요.":"아직 발급한 링크가 없어요. 위에서 링크를 발급해 보세요."}</div>`}`;
}
function rowHTML(r,showDept){
  const l=r.l, open=S.open===l.code;
  const prog = r.result ? "검사 완료" : r.tprog ? `검사 ${r.tprog}/10` : r.depth>=0 ? STEPS[r.depth] : "-";
  return `<div class="lrow st-${r.st}${open?" open":""}">
    <div class="lmain" data-row="${l.code}">
      <div class="nm"><b>${esc(l.name||"(이름 없음)")}</b>${l.memo?`<span>${esc(l.memo)}</span>`:""}${l.note?`<em>${esc(l.note)}</em>`:""}</div>
      <div class="st"><span class="tag st-${r.st}">${ST[r.st][0]}</span></div>
      <div>${showDept?esc(DN(l.dept)):esc(l.mgr||"")}</div>
      <div class="muted">${ft(l.at)}</div>
      <div>${r.last?`${ago(r.last)}`:`<span class="muted">-</span>`}</div>
      <div>${r.arr.length?r.arr.length+"회":"-"}</div>
      <div>${esc(prog)}</div>
      <div>${esc(resultName(r.result))}${r.want?`<br><b style="color:#ff8a6b">${esc(r.want)}</b>`:""}</div>
      <div class="hd">${(l.handled||"미연락")==="미연락"&&r.st!=="none"?`<button type="button" class="btn sm" data-done="${l.code}">연락함</button>`:""}<select data-handle="${l.code}">${HANDLE.map(h=>`<option${(l.handled||"미연락")===h?" selected":""}>${h}</option>`).join("")}</select></div>
      <div class="mob">${showDept?esc(DN(l.dept))+" · ":""}${esc(l.mgr||"")} · 보낸 때 ${ft(l.at)}${r.last?" · 마지막 열람 "+ago(r.last):""}${r.result?" · "+esc(resultName(r.result)):""}${r.want?" · 상담 희망 "+esc(r.want):""} · 처리 ${esc(l.handled||"미연락")}</div>
    </div>
    ${open?`<div class="ldet">
      <div><h2 style="font-size:15px;margin:12px 0 0">검사 답변 ${r.ans.length?`<small>${r.ans.length}개</small>`:""}</h2>
        ${r.ans.length?`<ul class="ans">${r.ans.map(a=>`<li class="${a.f?"fr":""}"><span>${esc(a.q)}</span><b>${esc(a.a)}</b></li>`).join("")}</ul>`:`<p class="muted">아직 검사 답변이 없어요.</p>`}</div>
      <div><h2 style="font-size:15px;margin:12px 0 0">기록</h2>
        <ul class="tl"><li><b>보낸 때</b>${ft(l.at)} · ${esc(l.tpl||"")}</li><li><b>처음 열람</b>${ft(r.first)||"-"}</li><li><b>마지막 열람</b>${ft(r.last)||"-"}</li><li><b>어디까지</b>${r.depth>=0?STEPS[r.depth]:"-"}</li><li><b>상담 희망</b>${esc(r.want)||"-"}</li><li><b>담당</b>${esc(l.mgr||"-")}</li></ul>
        <div class="r3"><div class="f"><label>이름</label><input data-ename="${l.code}" value="${esc(l.name||"")}" placeholder="학생 이름"></div><div class="f"><label>연락처 뒷자리</label><input data-ememo="${l.code}" value="${esc(l.memo||"")}" placeholder="7788"></div></div>
        <div class="f mobonly hd"><label>처리 상태</label><select data-handle="${l.code}">${HANDLE.map(h=>`<option${(l.handled||"미연락")===h?" selected":""}>${h}</option>`).join("")}</select></div>
        <div class="f"><label for="note_${l.code}">메모</label><textarea id="note_${l.code}" rows="2" data-note="${l.code}" placeholder="통화 내용, 다음 연락 날짜 등">${esc(l.note||"")}</textarea></div>
        <div class="row" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-recopy="msg" data-code="${l.code}">문구 다시 복사</button><button class="btn ghost sm" data-recopy="url" data-code="${l.code}">링크 복사</button><button class="btn danger sm" data-del="${l.code}">삭제</button></div>
        <p class="hint">${esc(linkUrl(l))}</p></div>
    </div>`:""}
  </div>`;
}

/* ---------- 저장 ---------- */
function saveLink(l){
  S.links[l.code]=l;
  if (S.mode==="fb") return db.collection("guide_links").doc(l.code).set(l).catch(()=>toast("<b>저장하지 못했어요.</b> 로그인과 규칙을 확인해 주세요."));
  ls.set("aix_admin_links",S.links); return Promise.resolve();
}
function patchLink(code,patch){
  const l=S.links[code]; if(!l) return; Object.assign(l,patch);
  if (S.mode==="fb") db.collection("guide_links").doc(code).update(patch).catch(()=>toast("<b>저장하지 못했어요.</b>"));
  else ls.set("aix_admin_links",S.links);
}
function delLink(code){
  delete S.links[code];
  if (S.mode==="fb") db.collection("guide_links").doc(code).delete().catch(()=>toast("<b>삭제하지 못했어요.</b>"));
  else ls.set("aix_admin_links",S.links);
}
function parseInput(ctx){
  const fixed = $("#iDept").type==="hidden", sel=$("#iDept").value;
  const lines=$("#iNames").value.split("\n").map(x=>x.trim()).filter(Boolean);
  if(!lines.length){ $("#iNames").focus(); toast("붙여 넣은 내용이 없어요."); return; }
  S.preview={ctx:String(ctx), rows:lines.map(line=>{ const p=parseLine(line); return {name:p.name, memo:p.memo, dept: fixed||sel!=="auto" ? sel : p.dept, src:line.slice(0,60)}; })};
  S.dNames=$("#iNames").value;
  redrawIssue(ctx);
}
function redrawIssue(ctx){
  if(!$("#modal").hidden){ $("#mbox").querySelector(".ibody").innerHTML=issueHTML(ctx); } else render(true);
}
function makeLinks(ctx){
  const pv=S.preview; if(!pv) return;
  const fixed=$("#iDept").type==="hidden";
  const mgr=myMgr();
  const made=pv.rows.map(r=>{ const l=newLink({name:r.name,memo:r.memo,dept:fixed?$("#iDept").value:r.dept,mgr}); return {code:l.code,name:l.name||"(이름 없음)",dept:l.dept,msg:msgFor(l),url:linkUrl(l)}; });
  S.made=made.concat(S.made).slice(0,80); S.preview=null; S.dNames="";
  toast(`<b>${made.length}명</b> 링크를 발급했어요. 학생별 '문구 복사'를 눌러 보내 주세요.`);
  redrawIssue(ctx);
}
function copy(t,done){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(done).catch(()=>toast("자동 복사가 막혀 있어요. 글을 길게 눌러 복사해 주세요.")); }
function openIssue(dept){
  S.preview=null;
  $("#mbox").innerHTML = `<button class="btn ghost sm x" data-close>닫기</button><h2>여러 명 한 번에 발급 ${dept!=="pick"?`<small>${esc(DN(dept))}</small>`:""}</h2><div class="ibody">${issueHTML(dept)}</div>`;
  $("#modal").hidden=false; setTimeout(()=>$("#iNames").focus(),50);
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click", e=>{
  const t=e.target;
  if (t.id==="login"){ doLogin(); return; }
  if (t.id==="logout"||t.id==="logout2"){ auth.signOut(); return; }
  if (t.id==="claim"){ claimOwner(); return; }
  if (t.id==="apply"){ applyStaff(); return; }
  const so=t.closest("[data-sok]"); if(so){ db.collection("guide_staff").doc(so.dataset.sok).update({ok:so.dataset.v==="1"}).then(()=>toast(so.dataset.v==="1"?"승인했어요.":"권한을 해제했어요.")).catch(()=>toast("<b>바꾸지 못했어요.</b>")); return; }
  const sd=t.closest("[data-sdel]"); if(sd){ if(sd.dataset.sure){ db.collection("guide_staff").doc(sd.dataset.sdel).delete().then(()=>toast("삭제했어요.")); } else { sd.dataset.sure="1"; sd.textContent="한 번 더"; } return; }
  const is=t.closest("[data-issue]"); if(is){ openIssue(is.dataset.issue); return; }
  if (t.closest("[data-close]") || t.id==="modal"){ $("#modal").hidden=true; render(true); return; }
  const tp=t.closest("[data-tpl]"); if(tp){ S.tpl=+tp.dataset.tpl; ls.set("aix_admin_tpl",S.tpl); document.querySelectorAll("[data-tpl]").forEach(c=>c.classList.toggle("on",+c.dataset.tpl===S.tpl)); return; }
  const ed=t.closest("[data-edit]"); if(ed){ S.editId=ed.dataset.edit; render(true); window.scrollTo(0,0); return; }
  const sv=t.closest("[data-save]"); if(sv){ saveContent(sv.dataset.save); return; }
  const rs=t.closest("[data-reset]"); if(rs){ if(rs.dataset.sure){ resetContent(rs.dataset.reset); } else { rs.dataset.sure="1"; rs.textContent="한 번 더 누르면 되돌려요"; } return; }
  if(t.closest("[data-addq]")){ draftOf(S.editId).faq.push({q:"",a:""}); render(true); return; }
  const rq=t.closest("[data-rmq]"); if(rq){ draftOf(S.editId).faq.splice(+rq.dataset.rmq,1); render(true); return; }
  const mv=t.closest("[data-mv]"); if(mv){ const f=draftOf(S.editId).faq, i=+mv.dataset.mv, j=i+(+mv.dataset.dir); [f[i],f[j]]=[f[j],f[i]]; render(true); return; }
  const qd=t.closest("[data-qd]"); if(qd){ S.qdept=qd.dataset.qd; ls.set("aix_admin_qd",S.qdept); const nm=$("#heroName")&&$("#heroName").value; render(true); if(nm) $("#heroName").value=nm; $("#heroName").focus(); return; }
  const qk=t.closest("[data-quick]"); if(qk){ quickIssue(qk.dataset.quick, qk.parentElement.querySelector("input")); return; }
  const ps=t.closest("[data-parse]"); if(ps){ parseInput(ps.dataset.parse); return; }
  const mk=t.closest("[data-make]"); if(mk){ makeLinks(S.preview&&S.preview.ctx); return; }
  const px=t.closest("[data-pvx]"); if(px){ S.preview.rows.splice(+px.dataset.pvx,1); redrawIssue(S.preview.ctx); return; }
  const cp=t.closest("[data-copy]"); if(cp){ const m=S.made.find(x=>x.code===cp.dataset.code); copy(cp.dataset.copy==="url"?m.url:m.msg,()=>{ m.copied=true; const card=cp.closest(".lk"); card.outerHTML=madeHTML(m); }); return; }
  const rc=t.closest("[data-recopy]"); if(rc){ const l=S.links[rc.dataset.code]; const url=linkUrl(l); const tpl=TPL.find(x=>x[0]===l.tpl)||TPL[0]; copy(rc.dataset.recopy==="url"?url:tpl[1](l.name||"학생")+"\n\n"+url,()=>toast("복사했어요.")); return; }
  const dn=t.closest("[data-done]"); if(dn){ patchLink(dn.dataset.done,{handled:"연락함"}); render(true); toast("연락함으로 바꿨어요."); return; }
  const dl=t.closest("[data-del]"); if(dl){ const l=S.links[dl.dataset.del]; if(dl.dataset.sure){ delLink(dl.dataset.del); S.open=null; render(); toast(`${esc(l.name)} 링크를 삭제했어요.`); } else { dl.dataset.sure="1"; dl.textContent="한 번 더 누르면 삭제"; } return; }
  const fl=t.closest("[data-filter]"); if(fl){ S.filter=fl.dataset.filter; render(); return; }
  if (t.closest("select,textarea,input,button,a")) return;
  const rw=t.closest("[data-row]"); if(rw){ S.open = S.open===rw.dataset.row ? null : rw.dataset.row; render(); }
});
document.addEventListener("change", e=>{ if(e.target.dataset.pvd!=null){ S.preview.rows[+e.target.dataset.pvd].dept=e.target.value; return; }
  const h=e.target.closest("[data-handle]"); if(h){ patchLink(h.dataset.handle,{handled:h.value}); render(); return; }
  if (e.target.id==="fm"){ S.mgr=e.target.value; render(); }
});
document.addEventListener("input", e=>{ const t=e.target;
  if(t.dataset.path!=null){ setPath(draftOf(S.editId), t.dataset.path, t.dataset.lines!=null ? t.value.split("\n").map(x=>x.trim()).filter(Boolean) : t.value); return; }
  if(t.dataset.pvn!=null) S.preview.rows[+t.dataset.pvn].name=t.value.trim();
  if(t.dataset.pvm!=null) S.preview.rows[+t.dataset.pvm].memo=t.value.trim();
  if(t.id==="meMgr") ls.set("aix_admin_mgr",t.value.trim()); if(e.target.id==="fq"){ S.q=e.target.value.trim(); render(true); } if(e.target.id==="iNames") S.dNames=e.target.value; });
document.addEventListener("focusout", e=>{ if(S.pending) setTimeout(()=>{ const a=document.activeElement; if(!(a && $("#app").contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName))) render(); },60);
  const en=e.target.closest("[data-ename]"); if(en){ const l=S.links[en.dataset.ename]; if(l&&l.name!==en.value.trim()){ patchLink(en.dataset.ename,{name:en.value.trim()}); toast("이름을 저장했어요."); } }
  const em=e.target.closest("[data-ememo]"); if(em){ const l=S.links[em.dataset.ememo]; if(l&&(l.memo||"")!==em.value.trim()) patchLink(em.dataset.ememo,{memo:em.value.trim()}); }
  const n=e.target.closest("[data-note]"); if(n){ const l=S.links[n.dataset.note]; if(l && (l.note||"")!==n.value){ patchLink(n.dataset.note,{note:n.value}); toast("메모를 저장했어요."); } } });
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.dataset.qname!=null){ e.preventDefault(); quickIssue(e.target.dataset.qname, e.target); return; } if(e.key==="Escape" && !$("#modal").hidden){ $("#modal").hidden=true; render(); } });
window.addEventListener("beforeunload", e=>{ if(Object.keys(S.draft).some(k=>JSON.stringify(S.draft[k])!==JSON.stringify(currentContent(k)))){ e.preventDefault(); e.returnValue=""; } });
window.addEventListener("hashchange", ()=>{ S.open=null; S.filter="all"; render(); window.scrollTo(0,0); });

render();
initFirebase().then(ok=>{ if(ok) startFb(); else startLocal(); });
}
</script>
</body>
</html>
